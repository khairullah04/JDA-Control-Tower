<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · JDA Control Tower</title>
<link rel="icon" href="/shared/assets/brand/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/styles/tokens.css">
  <link rel="stylesheet" href="/public/styles/site.css">
</head>
<body>
  <main class="login-page">
    <form class="login-card" id="login-form" novalidate>
      <span class="wordmark">TRICIPTA AI</span>
      <div>
        <h1>JDA Control Tower</h1>
        <p>Employee sign-in. Use the username or email your administrator gave you.</p>
      </div>
      <label class="field">Username or email<input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="login-msg" required></label>
      <label class="field">Password<input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="login-msg" required></label>
      <p class="msg" id="login-msg" role="alert"></p>
      <p class="msg ok" id="login-status" role="status"></p>
      <button class="btn primary" id="login-btn">Sign in</button>
      <a class="login-back" href="/">← Back to TriCipta AI</a>
    </form>
  </main>
  <script type="module" src="/public/components/login.js"></script>
</body>
</html>
