<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>JDA · TriCipta AI</title>
<link rel="icon" href="/shared/assets/brand/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles/tokens.css">
<link rel="stylesheet" href="/shared/styles/report.css">
<link rel="stylesheet" href="/public/styles/info.css">
</head>
<body>
<!-- A JDA's public Info page: its Master Page (there is no private copy), drawn from what
     /api/public/info/<id> sends (server/site-content.js decides what that is). Signed in, Edit Master Page
     turns it into the editor (web/control-tower/components/master-edit.js). -->
<a class="skip" href="#info-main">Skip to content</a>
<div class="app">
<div class="topbar">
 <div class="topbar-inner">
  <a class="brand info-brand" href="/">
    <span class="info-mark" aria-hidden="true">T</span>
    <div><div class="mark">TriCipta AI</div><h1 id="brandTitle">JDA</h1></div>
  </a>
  <nav class="info-nav" aria-label="Site">
    <a class="info-link" id="allJdas" href="/#jdas"><span aria-hidden="true">←</span> All JDAs</a>
    <a class="info-link solid" id="fullReport" href="/login">Employee sign-in</a>
  </nav>
 </div>
</div>

<p class="info-strip" id="infoStrip" hidden></p>
<main class="page-wrap" id="info-main" tabindex="-1">
  <p class="info-load" id="loadNote" role="status">Loading…</p>

  <section class="screen" id="screen-overview">
    <div class="hero">
      <div class="hero-inner">
        <div class="eyebrow" id="heroEyebrow"></div>
        <h2 id="heroTitle"></h2>
        <p class="sub" id="heroSub" hidden></p>
        <button type="button" class="hero-more-toggle" id="heroMoreBtn" aria-expanded="false" aria-controls="heroMore" hidden>
          <span>Read more</span><span class="chev">&#8250;</span>
        </button>
        <div class="hero-more" id="heroMore"><p id="heroMoreText"></p></div>
      </div>
    </div>
    <div id="sections"></div>
  </section>

  <section class="screen" id="screen-solution">
    <button type="button" class="back-link" id="backBtn">← Back to overview</button>
    <div class="block" style="margin-top:0;">
      <div class="sol-detail-card">
        <div class="sol-detail-head">
          <span class="sol-detail-icon" id="solDetailIcon"></span>
          <div class="sol-detail-headtext">
            <span class="sol-tier" id="solDetailTier"></span>
            <h2 id="solDetailTitle"></h2>
          </div>
        </div>
        <div id="solDetailBlocks" class="blk-grid"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="foot-inner">
    <div><div class="foot-brand"><span class="info-mark small" aria-hidden="true">T</span><span>TriCipta AI</span></div></div>
    <div class="foot-note" id="footNote"></div>
  </div>
</footer>
</div>
<script type="module" src="/public/components/info.js"></script>
</body>
</html>
